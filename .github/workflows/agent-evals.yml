name: Agent evals

# Runs the 50-case clinical-graph golden set against the agent under agent/.
# Five required boolean buckets:
#   schema_valid, citation_present, factually_consistent, safe_refusal,
#   no_phi_in_logs (10 cases each = 50).
#
# The runner fails (exit code 1) when ANY category:
#   - drops more than 5% from baseline, OR
#   - falls below its absolute min_threshold floor.
# Same applies to the total. Thresholds live in agent/eval_baseline.json.
#
# This workflow is the PR-blocking gate. Pair it with a GitHub branch-
# protection rule on `master` ("Require status checks to pass before
# merging" → "Agent evals / eval") so failed eval runs block merge.
# Local complement: .pre-commit-config.yaml ships pre-commit + pre-push
# hooks that run the same suite (deterministic-only on commit, full on push).

on:
  push:
    branches: [master]
    paths:
      - "agent/**"
      - ".github/workflows/agent-evals.yml"
  pull_request:
    paths:
      - "agent/**"
      - ".github/workflows/agent-evals.yml"
  workflow_dispatch: {}

concurrency:
  group: agent-evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Verify ANTHROPIC_API_KEY secret is set
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is required for the LLM-dependent eval categories."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bring up OpenEMR development stack
        working-directory: docker/development-easy
        run: |
          docker compose up --detach --wait
          # Wait until the openemr container reports healthy.
          for i in $(seq 1 60); do
            status=$(docker compose ps --format json | python3 -c "import sys,json; print('|'.join(c.get('Health','') for c in [json.loads(l) for l in sys.stdin if l.strip()]))" || true)
            echo "[$i] health: $status"
            echo "$status" | grep -q "starting" || break
            sleep 5
          done

      - name: Verify external corpus is committed
        working-directory: agent
        run: |
          # The corpus is cached in the repo so CI doesn't depend on FDA /
          # PubMed API uptime. Refresh locally with fetch_external_guidelines.py.
          test -d external_corpus
          echo "external_corpus contains $(ls external_corpus/*.md | wc -l) files"

      - name: Seed sample patients (extract + ingest the 4 sample documents)
        working-directory: agent
        run: |
          python ingest_to_openemr.py
          python backfill_family_history.py
          python backfill_address_and_lab_notes.py
          python backfill_citations.py
          python backfill_bboxes.py

      - name: Run 58-case eval
        working-directory: agent
        # The previous "Seed" step ran inside the OpenEMR docker container
        # and chowned agent/ to root, so write to /tmp from CI.
        run: |
          python eval_clinical_graph.py --out /tmp/eval_clinical_results.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-clinical-results
          path: /tmp/eval_clinical_results.json

      - name: Tear down compose stack
        if: always()
        working-directory: docker/development-easy
        run: docker compose down --volumes --remove-orphans
